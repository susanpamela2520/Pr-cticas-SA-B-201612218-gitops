# Secretos de la plataforma, cifrados con Sealed Secrets.
# La llave privada nunca sale del cluster, por lo que este archivo
# es seguro de versionar en un repositorio publico.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: sa-platform-db-credenciales
  namespace: sa-prod
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      creationTimestamp: null
      name: sa-platform-db-credenciales
      namespace: sa-prod
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: sa-platform-broker-credenciales
  namespace: sa-prod
spec:
  encryptedData:
    RABBITMQ_DEFAULT_PASS: 
    RABBITMQ_DEFAULT_USER: 
  template:
    metadata:
      creationTimestamp: null
      name: sa-platform-broker-credenciales
      namespace: sa-prod
---

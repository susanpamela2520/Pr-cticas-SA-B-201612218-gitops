apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "tickets-service") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "tickets-service") | nindent 4 }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: tickets-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tickets-service
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      # Reparte las replicas entre nodos distintos. Sin esto, el
      # PodDisruptionBudget no protege nada: si las dos replicas viven en el
      # mismo nodo, ese nodo se lleva ambas de golpe.
      #
      # "preferred" y no "required": con required, si hay menos nodos que
      # replicas, los pods sobrantes quedan en Pending para siempre, lo que
      # convierte una mejora de disponibilidad en una caida.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: tickets-service
                    app.kubernetes.io/instance: {{ .Release.Name }}
      serviceAccountName: {{ include "sa-platform.fullname" (dict "root" $ "name" "tickets-service") }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: tickets-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "sa-platform.fullname" (dict "root" $ "name" "tickets-service-config") }}
            - secretRef:
                name: {{ include "sa-platform.fullname" (dict "root" $ "name" "tickets-service-secret") }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /health, port: {{ .Values.containerPort }} }
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.containerPort }} }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.containerPort }} }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
      volumes:
        - name: tmp
          emptyDir: {}

{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: validacion-canary
spec:
  args:
    - name: servicio-canary
  metrics:
    - name: disponibilidad
      interval: {{ .Values.analisis.intervalo }}
      count: {{ .Values.analisis.repeticiones }}
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                containers:
                  - name: sonda
                    image: curlimages/curl:8.10.1
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests: { cpu: 50m, memory: 64Mi }
                      limits:   { cpu: 100m, memory: 128Mi }
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        CODIGO=$(curl -s -o /dev/null -w "%{http_code}" \
                          --max-time 5 "http://{{ "{{args.servicio-canary}}" }}:8080/health")
                        echo "Codigo HTTP recibido: $CODIGO"
                        [ "$CODIGO" = "200" ]
    - name: tasa-de-exito
      interval: {{ .Values.analisis.intervalo }}
      count: {{ .Values.analisis.repeticiones }}
      failureLimit: 2
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                containers:
                  - name: sonda
                    image: curlimages/curl:8.10.1
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests: { cpu: 50m, memory: 64Mi }
                      limits:   { cpu: 100m, memory: 128Mi }
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        EXITOS=0
                        for i in $(seq 1 100); do
                          C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                            "http://{{ "{{args.servicio-canary}}" }}:8080/health")
                          [ "$C" = "200" ] && EXITOS=$((EXITOS+1))
                        done
                        echo "Exitos: $EXITOS de 100"
                        [ "$EXITOS" -ge {{ .Values.analisis.exitoMinimo }} ]
    - name: latencia-p95
      interval: {{ .Values.analisis.intervalo }}
      count: {{ .Values.analisis.repeticiones }}
      failureLimit: 2
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                containers:
                  - name: sonda
                    image: curlimages/curl:8.10.1
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests: { cpu: 50m, memory: 64Mi }
                      limits:   { cpu: 100m, memory: 128Mi }
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        for i in $(seq 1 20); do
                          curl -s -o /dev/null -w "%{time_total}\n" --max-time 5 \
                            "http://{{ "{{args.servicio-canary}}" }}:8080/health"
                        done | sort -n | awk '
                          { v[NR]=$1 }
                          END {
                            p = v[int(NR*0.95)] * 1000
                            printf "p95 = %.0f ms\n", p
                            exit (p > {{ .Values.analisis.latenciaMaximaMs }})
                          }'
{{- end }}

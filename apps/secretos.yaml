# Los SealedSecrets van en wave 1: deben existir antes que los pods.
# Si llegan despues, los contenedores quedan en CreateContainerConfigError.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-secretos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/susanpamela2520/Pr-cticas-SA-B-201612218-gitops.git
    targetRevision: main
    path: secrets
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
